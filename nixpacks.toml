[variables]
# Required for Laravel DB connections on Railway (MySQL or PostgreSQL).
NIXPACKS_PHP_EXTENSIONS = "pdo_mysql,pdo_pgsql,mbstring,tokenizer,xml,curl,zip,bcmath"

[phases.setup]
nixPkgs = [
  "php82",
  "php82Packages.composer",
  "nodejs_18"
]

[phases.build]
cmds = [
  "composer install --no-interaction --prefer-dist --optimize-autoloader",
  "npm install",
  "npm run build",
  "php artisan storage:link"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
